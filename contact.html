<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Playfair+Display:wght@400;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <title>WCB CAFE - Contact</title>
</head>
<body>
    <header class="page-header">
        <h1><img class="logo" src="images/logo.svg" alt="WCB CAFE"></h1>
        <nav>
            <ul class="main-nav">
                <li><a href="index.html">News</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact 主要內容區塊 -->
    <div class="contact-container wp">
        <!-- 左側：聯絡表單 -->
        <div class="contact-form">
            <h2 class="page-title">CONTACT US</h2>
            <p class="sub-text">有任何包場需求、餐點諮詢或寶貴建議，歡迎隨時與我們聯繫。</p>
            
            <form action="#">
                <div class="form-group">
                    <label for="name">您的姓名 / Name</label>
                    <input type="text" id="name" name="name" placeholder="請輸入您的稱呼" required>
                </div>

                <div class="form-group">
                    <label for="email">電子信箱 / Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="message">留言內容 / Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="請輸入您想詢問的內容或訂位需求..."></textarea>
                </div>

                <button type="submit" class="gold-btn">送出訊息 / SEND</button>
            </form>
        </div>

        <!-- 右側：店家資訊與地圖 -->
        <div class="contact-info">
            <h2 class="page-title">STORE INFO</h2>
            <ul class="info-list">
                <li><strong>店名：</strong>WCB CAFE 精品咖啡館</li>
                <li><strong>地址：</strong>台北市信義區松高路 123 號 100 樓</li>
                <li><strong>電話：</strong>(02) 2345-6789</li>
                <li><strong>營業時間：</strong>週一至週日 10:00 - 21:00</li>
                <li><strong>公休日：</strong>每週二公休</li>
            </ul>

            <!-- 內嵌 Google 地圖（加上金邊質感） -->
            <div class="map-box">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3614.703649799043!2d121.56235021500643!3d25.03396388397249!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442abb6da9c9e1f%3A0x1206bcf082fd10a6!2z5Y-w5YyXMTAx!5e0!3m2!1szh-TW!2stw!4v1614000000000!5m2!1szh-TW!2stw" width="100%" height="260" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <footer>
        <div class="ft">
            <p>&copy;2026 版權所有 B11421034</p>
        </div>
    </footer>
</body>
</html>
